[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clustered-xyonion"
version = "0.1.0"
description = "XYOnion train/test splitting with an optional per-cluster (kmeans / HDBSCAN) variant, as a scikit-learn estimator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pandas>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clustered_xyonion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
