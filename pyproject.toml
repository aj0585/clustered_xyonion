[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clustered-xyonion"
version = "0.1.0"
description = "XYOnion train/test splitting with an optional per-cluster (kmeans / HDBSCAN) variant, as a scikit-learn splitter."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.21.5",
    "scipy==1.7.3",
    "scikit-learn==1.0.2",
]

[dependency-groups]
dev = [
    "pytest==6.2.5",
    "pandas==1.3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clustered_xyonion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
